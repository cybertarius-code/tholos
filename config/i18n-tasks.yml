# Configuración de i18n-tasks: https://github.com/glebm/i18n-tasks
base_locale: es
locales: [es, en]

data:
  read:
    - config/locales/%{locale}.yml
    - config/locales/**/*.%{locale}.yml
  # Cada dominio de claves vive en su propio fichero por locale.
  write:
    - ["{accounts,activerecord.attributes.account,activerecord.errors.models.account,activerecord.models.account}.*", "config/locales/accounts.%{locale}.yml"]
    - ["{categories,activerecord.attributes.category,activerecord.errors.models.category,activerecord.models.category}.*", "config/locales/categories.%{locale}.yml"]
    - ["{transactions,activerecord.attributes.transaction,activerecord.errors.models.transaction,activerecord.models.transaction}.*", "config/locales/transactions.%{locale}.yml"]
    - ["{date,number}.*", "config/locales/formats.%{locale}.yml"]
    - ["dashboard.*", "config/locales/dashboards.%{locale}.yml"]
    - ["households.*", "config/locales/household.%{locale}.yml"]
    - ["{passwords,passwords_mailer}.*", "config/locales/passwords.%{locale}.yml"]
    - ["sessions.*", "config/locales/sessions.%{locale}.yml"]
    - "config/locales/%{locale}.yml"
  yaml:
    write:
      line_width: -1

search:
  paths:
    - app/
  exclude:
    - app/assets/images
    - app/assets/fonts
    - app/assets/videos
    - app/assets/builds

# Claves que Rails/rails-i18n consumen de forma implícita (no aparecen como t("...") en el código).
ignore_unused:
  - "activerecord.*"
  - "date.*"
  - "number.*"
  # Claves dinámicas: t("accounts.kinds.#{kind}")
  - "accounts.kinds.*"
  - "accounts.classifications.*"
  # Claves dinámicas: t("categories.kinds.#{kind}"), etc.
  - "categories.{kinds,report_groups,colors,icons}.*"
  - "categories.index.{sections,new}.*"
  - "categories.index.move_{up,down}"
  - "categories.new.title.*"
  - "transactions.{directions,statuses}.*"
